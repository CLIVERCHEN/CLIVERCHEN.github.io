<dialog id="lightbox" class="lightbox" aria-label="Photograph viewer" aria-describedby="lightbox-caption">
  <div class="lightbox-toolbar"><span id="lightbox-count" aria-live="polite"></span><div><a id="lightbox-original" href="#" target="_blank" rel="noopener" aria-label="Open large image in a new tab">Open image ↗</a><button type="button" class="lightbox-close" aria-label="Close photograph viewer">×</button></div></div>
  <button type="button" class="lightbox-prev" aria-label="Previous photograph">‹</button>
  <figure class="lightbox-figure"><img id="lightbox-image" alt=""><figcaption id="lightbox-caption" aria-live="polite"></figcaption></figure>
  <button type="button" class="lightbox-next" aria-label="Next photograph">›</button>
  <p class="lightbox-help">← → to browse <span>·</span> Esc to close</p>
</dialog>
