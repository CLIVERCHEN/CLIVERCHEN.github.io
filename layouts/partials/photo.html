<figure class="photo-card">
  <a href="{{ .full | relURL }}" class="photo-open" data-lightbox data-title="{{ .title }}" data-preview="{{ .thumb | relURL }}" aria-label="Enlarge: {{ .title }}">
    <img src="{{ .thumb | relURL }}" width="{{ .width }}" height="{{ .height }}" alt="{{ .alt }}" loading="lazy" decoding="async">
    <span class="photo-expand" aria-hidden="true">↗</span>
  </a>
  <figcaption>{{ .title }}</figcaption>
</figure>
