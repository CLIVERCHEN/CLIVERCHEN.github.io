baseURL = "https://cliverchen.github.io/"
languageCode = "en-us"
title = "Keru Chen"
theme = "acad-homepage"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
description = "Keru Chen is a PhD student at Arizona State University working on reinforcement learning, LLM post-training, safety, and alignment."
scholar = "https://scholar.google.com/citations?user=W0LexmIAAAAJ&hl=en"
email = "kchen234@asu.edu"

[module]
  [[module.mounts]]
  source = "static"
  target = "static"
  excludeFiles = ["img/photography/**", "css/**", "js/**"]

[markup.goldmark.renderer]
unsafe = true

[build]
noJSConfigInAssets = true
